# Render Blueprint — creates the web service and a PostgreSQL database.
# Dashboard › New › Blueprint › select this repository.
services:
  - type: web
    name: adam-chellvan-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    # Applies pending migrations safely before each start (never resets data).
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: adam-chellvan-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: LISTING_REF_PREFIX
        value: ACP
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false

databases:
  - name: adam-chellvan-db
    plan: basic-256mb
    databaseName: adam_chellvan
